<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>ZenOffice · Diktat</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="/diktat/manifest.json">
<meta name="theme-color" content="#111010">
<link rel="icon" type="image/png" href="/diktat-icon-192.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diktat">
<link rel="apple-touch-icon" href="/diktat-icon-180.png?v=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111010;--bg2:#181716;--bg3:#201e1d;--bg4:#2a2725;
  --border:#2e2b29;--border2:#3a3632;
  --text:#e8e2d9;--text2:#9a9088;--text3:#5a5450;
  --gold:#c9a96e;--gold2:#a07840;--sage:#7a9e7e;--rose:#c4847a;--sky:#7a9ec4;
  --fs:'Cormorant Garamond',Georgia,serif;--fn:'DM Sans',system-ui,sans-serif;
}
body.light{
  --bg:#f5f1eb;--bg2:#faf7f2;--bg3:#ede9e0;--bg4:#e0dbd0;
  --border:#d8d2c5;--border2:#c8c0b0;
  --text:#1a1714;--text2:#7a7060;--text3:#b0a898;
  --gold:#8b6535;--gold2:#6b4e28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fn);display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:hidden;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:880px;flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}

/* Kopfzeile */
.hd{display:flex;align-items:center;gap:10px}
.hd img{width:30px;height:30px;border-radius:8px}
.ttl{font-family:var(--fs);font-size:24px;font-weight:300;letter-spacing:.04em;color:var(--gold);flex:1}
.ttl small{font-family:var(--fn);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-left:6px}
.pill{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:999px;padding:9px 16px;font:500 14px var(--fn);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;user-select:none}
.pill:active{transform:scale(.96)}
.pill.on{color:var(--gold);border-color:var(--gold2)}
.pill svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill.sm{padding:8px 12px;font-size:13px}

/* Textfeld */
#txt{flex:1;min-height:120px;width:100%;resize:none;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:18px;
  padding:20px 22px;font:300 clamp(19px,2.6vw,24px)/1.55 var(--fn);outline:none;transition:border-color .2s}
#txt:focus{border-color:var(--border2)}
#txt.rec{border-color:rgba(196,132,122,.55)}
#txt.busy{opacity:.45}
#txt::placeholder{color:var(--text3)}

/* Status */
#stat{min-height:24px;text-align:center;font-size:15px;color:var(--text2)}
#stat.ok{color:var(--sage)}
#stat.err{color:var(--rose)}
#stat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rose);margin-right:8px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* Knöpfe unten */
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.bot{display:flex;align-items:center;justify-content:center;gap:22px}
#mic{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold2);background:var(--bg3);color:var(--gold);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px var(--fn);transition:all .2s;flex-shrink:0}
#mic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#mic:active{transform:scale(.95)}
#mic.rec{border-color:var(--rose);color:var(--rose);background:rgba(196,132,122,.12);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,132,122,.45)}70%{box-shadow:0 0 0 22px rgba(196,132,122,0)}100%{box-shadow:0 0 0 0 rgba(196,132,122,0)}}
.side{width:110px;display:flex;justify-content:center}

/* Verlauf */
#hist{display:none;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:12px}
#hist.vis{display:flex}
#hist .it{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--text);cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hist .it:active{border-color:var(--gold2)}
#hist .em{color:var(--text3);font-size:14px;text-align:center;padding:8px}
.hidden{display:none!important}
@media (max-height:520px){#mic{width:76px;height:76px}#mic svg{width:28px;height:28px}.wrap{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <img src="/diktat-icon-192.png?v=1" alt="">
    <div class="ttl">Diktat<small>ZenOffice</small></div>
    <button class="pill sm on hidden" id="instbtn" onclick="installApp()" title="Als eigene App auf den Startbildschirm">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Installieren</button>
    <button class="pill sm" id="langbtn" onclick="toggleLang()" title="Sprache">DE</button>
    <button class="pill sm on" id="smbtn" onclick="toggleSmooth()" title="Text von der KI glätten lassen">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Glätten</button>
    <button class="pill sm" onclick="toggleTheme()" title="Hell / Dunkel">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
  </div>

  <textarea id="txt" placeholder="Einfach losreden …" spellcheck="true"></textarea>
  <div id="stat"></div>

  <div class="row" id="acts">
    <button class="pill" onclick="copyNow()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Kopieren</button>
    <button class="pill hidden" id="origbtn" onclick="toggleOrig()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Original</span></button>
    <button class="pill" onclick="redoSmooth()" id="againbtn"><svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Neu glätten</button>
    <button class="pill" onclick="toggleHist()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  </div>
  <div id="hist"></div>

  <div class="bot">
    <div class="side"><button class="pill" id="morebtn" onclick="startRec(true)" title="Am Ende weitersprechen">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Weiter</button></div>
    <button id="mic" onclick="micTap()"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span id="miclbl">Start</span></button>
    <div class="side"><button class="pill" onclick="clearAll()" title="Text leeren und neu beginnen">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Neu</button></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// ZenOffice Diktat – sprechen, glätten, kopieren
// ═══════════════════════════════════════
const $=id=>document.getElementById(id);
const txt=$('txt'), stat=$('stat'), mic=$('mic');
const SMOOTH_MODEL='claude-haiku-5-5'; // Nano: schnell und günstig; Ersatzkette liegt in api/claude.js
let state='idle';          // idle | rec | paused | smooth | done
let rec=null, base='', live='', lang='de-DE', raw='', smoothed='', showOrig=false, wakeLock=null;
let smoothOn=true;
try{smoothOn=localStorage.getItem('zo_dk_smooth')!=='0'}catch(e){}
try{if(localStorage.getItem('zo_dk_light')==='1')document.body.classList.add('light')}catch(e){}
try{lang=localStorage.getItem('zo_dk_lang')||'de-DE'}catch(e){}
$('smbtn').classList.toggle('on',smoothOn);
$('langbtn').textContent=lang==='de-DE'?'DE':'EN';

function setStat(html,cls=''){stat.className=cls;stat.innerHTML=html}
function setState(s){
  state=s;
  const r=s==='rec';
  mic.classList.toggle('rec',r);
  txt.classList.toggle('rec',r);
  txt.classList.toggle('busy',s==='smooth');
  txt.readOnly=r||s==='smooth';
  $('miclbl').textContent=r?'Fertig':'Start';
  $('acts').style.visibility=(r||s==='smooth')?'hidden':'visible';
  $('morebtn').style.visibility=(r||s==='smooth'||!txt.value.trim())?'hidden':'visible';
  if(r) keepAwake(); else releaseAwake();
}

// ── Aufnahme ──
function micTap(){ if(state==='rec') finish(); else if(state!=='smooth') startRec(false); }

// append=true: am vorhandenen Text weitersprechen, sonst neu beginnen
function startRec(append){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStat('Spracheingabe geht hier nicht – bitte Chrome verwenden.','err');return}
  if(state==='rec') return;
  if(!append){ if(txt.value.trim()) addHist(txt.value.trim()); txt.value=''; raw=smoothed=''; showOrig=false; $('origbtn').classList.add('hidden') }
  base=txt.value.trim(); live=base;
  setState('rec');
  setStat('<span class="dot"></span>Ich höre zu …');
  runEngine();
}
function runEngine(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang=lang; rec.continuous=true; rec.interimResults=true;
  let heard=false; // wurde in dieser Runde etwas gesprochen?
  rec.onresult=e=>{
    const t=dicText(e.results); if(!t) return;
    heard=true;
    live=join(base,t);
    txt.value=live; txt.scrollTop=txt.scrollHeight;
  };
  // Chrome (v. a. Android) beendet nach einer Sprechpause von selbst; jeder Neustart piept.
  // Darum nur weiterhören, wenn in dieser Runde gesprochen wurde. Endet eine Runde stumm,
  // ist das Diktat fertig (glätten + kopieren) – so gibt es kein Dauer-Piepen mehr.
  rec.onend=()=>{
    base=live;
    if(state!=='rec') return;
    if(heard){ heard=false; setTimeout(()=>{ if(state==='rec'){ try{rec.start()}catch(e){setTimeout(()=>{if(state==='rec')runEngine()},300)} } },150); return }
    if(txt.value.trim()) finish();
    else { stopEngine(); setState('idle'); setStat('Nichts gehört – zum Sprechen aufs Mikrofon tippen.') }
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      stopEngine(); setState('idle');
      setStat('Bitte den Mikrofon-Zugriff erlauben – dann aufs Mikrofon tippen.','err');
    }
  };
  try{rec.start()}catch(e){console.warn('Diktat Start Fehler:',e)}
}
function stopEngine(){
  if(!rec) return;
  rec.onend=rec.onerror=rec.onresult=null;
  try{rec.stop()}catch(e){}
  rec=null; base=live;
}
// Neuen Satzteil anhängen, Satzanfang groß
function join(a,b){
  b=b.trim(); if(!b) return a;
  if(!a) return b[0].toUpperCase()+b.slice(1);
  if(/[.!?:]$/.test(a)) b=b[0].toUpperCase()+b.slice(1);
  return a+' '+b;
}
// Wie in ZenOffice: Android liefert denselben Satz mehrfach und wachsend – wiederholte Fassungen ersetzen die vorige
function dicText(results){
  const norm=t=>t.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim(), parts=[];
  for(let i=0;i<results.length;i++){
    const t=results[i][0].transcript.trim(); if(!t) continue;
    if(parts.length){
      const a=norm(parts[parts.length-1]), b=norm(t);
      if(b.startsWith(a)){parts[parts.length-1]=t;continue}
      if(a.startsWith(b)) continue;
    }
    parts.push(t);
  }
  return parts.join(' ');
}

// ── Fertig: glätten und kopieren ──
async function finish(){
  stopEngine();
  const t=txt.value.trim();
  if(!t){setState('idle');setStat('Nichts gehört – aufs Mikrofon tippen und noch einmal sprechen.');return}
  raw=t;
  if(!smoothOn){ setState('done'); await copyOut(t,''); return }
  await smooth(t);
}
async function smooth(t){
  setState('smooth');
  setStat('Text wird geglättet …');
  try{
    const r=await callClaude(t);
    if(!r.trim()) throw new Error('leere Antwort');
    smoothed=r.trim(); txt.value=smoothed; showOrig=false;
    $('origbtn').classList.toggle('hidden',smoothed===raw);
    $('origbtn').querySelector('span').textContent='Original';
    setState('done');
    await copyOut(smoothed,'Geglättet');
  }catch(e){
    console.warn('Glätten Fehler:',e);
    txt.value=t; setState('done');
    await copyOut(t,'Glätten ging nicht ('+esc(e.message)+') – Originaltext');
  }
}
function redoSmooth(){ const t=txt.value.trim(); if(!t||state==='rec'||state==='smooth') return; raw=t; smooth(t) }

// Gleiche Anweisung wie „Optimieren → Grammatik & Klang“, ergänzt um typische Diktat-Fehler
async function callClaude(text){
  const task='Glätte diesen diktierten Text. Verbessere Grammatik, Klang und Stil: seriös, aber modern und angenehm. '
    +'Setze Satzzeichen und Großschreibung, korrigiere falsch erkannte oder verdrehte Wörter, entferne Füllwörter (äh, ähm, also halt) und Wiederholungen. '
    +'Gesprochene Anweisungen wie „Komma“, „Punkt“, „Fragezeichen“, „neue Zeile“ oder „neuer Absatz“ setzt du als Zeichen bzw. Umbruch um. '
    +'Inhalt, Aussage, Tonfall und Sprache bleiben erhalten; erfinde nichts hinzu. Nur der Text.';
  const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:SMOOTH_MODEL,max_tokens:Math.min(4000,600+text.length),
      system:'Du bist ein professioneller Textassistent. Gib NUR den fertigen Text zurück – keine Vorbemerkungen, Anführungszeichen oder Erklärungen.',
      messages:[{role:'user',content:'Aufgabe: '+task+'\n\nText:\n'+text}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error||'Claude Fehler '+r.status)}
  const d=await r.json();
  return d.content?.map(c=>c.text||'').join('')||'';
}

// ── Zwischenablage ──
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true }catch(e){}
  // Ersatz für ältere Browser: über das Textfeld kopieren
  try{ txt.focus(); txt.select(); const ok=document.execCommand('copy'); txt.setSelectionRange(txt.value.length,txt.value.length); txt.blur(); return ok }catch(e){ return false }
}
async function copyOut(t,label){
  addHist(t);
  if(await copyText(t)) setStat('✓ '+(label?label+' und ':'')+'kopiert – jetzt einfach einfügen','ok');
  else setStat((label?label+'. ':'')+'Automatisch kopieren ging nicht – bitte auf „Kopieren“ tippen.','err');
}
async function copyNow(){
  const t=txt.value.trim(); if(!t) return;
  const ok=await copyText(t);
  setStat(ok?'✓ Kopiert':'Kopieren ging nicht – Text markieren und lange drücken.',ok?'ok':'err');
}
function toggleOrig(){
  showOrig=!showOrig;
  txt.value=showOrig?raw:smoothed;
  $('origbtn').querySelector('span').textContent=showOrig?'Geglättet':'Original';
  copyNow();
}
function clearAll(){
  if(state==='rec') stopEngine();
  if(txt.value.trim()) addHist(txt.value.trim());
  txt.value=''; raw=smoothed=''; $('origbtn').classList.add('hidden');
  setState('idle'); setStat('');
  startRec(false);
}

// ── Verlauf (die letzten 10 Texte, nur auf diesem Gerät) ──
function getHist(){try{return JSON.parse(localStorage.getItem('zo_dk_hist')||'[]')}catch(e){return[]}}
function addHist(t){
  if(!t) return;
  const h=getHist().filter(x=>x!==t); h.unshift(t);
  try{localStorage.setItem('zo_dk_hist',JSON.stringify(h.slice(0,10)))}catch(e){}
  if($('hist').classList.contains('vis')) renderHist();
}
function renderHist(){
  const h=getHist(), box=$('hist');
  box.innerHTML=h.length?'':'<div class="em">Noch nichts im Verlauf</div>';
  h.forEach(t=>{const d=document.createElement('div');d.className='it';d.textContent=t;
    d.onclick=async()=>{txt.value=t;raw=smoothed=t;$('origbtn').classList.add('hidden');setState('done');
      const ok=await copyText(t); setStat(ok?'✓ Aus dem Verlauf kopiert':'Bitte auf „Kopieren“ tippen.',ok?'ok':'err')};
    box.appendChild(d)});
}
function toggleHist(){const b=$('hist');b.classList.toggle('vis');if(b.classList.contains('vis'))renderHist()}

// ── Einstellungen ──
function toggleLang(){
  lang=lang==='de-DE'?'en-US':'de-DE';
  $('langbtn').textContent=lang==='de-DE'?'DE':'EN';
  try{localStorage.setItem('zo_dk_lang',lang)}catch(e){}
  if(state==='rec'){stopEngine();runEngine()}
}
function toggleSmooth(){
  smoothOn=!smoothOn; $('smbtn').classList.toggle('on',smoothOn);
  try{localStorage.setItem('zo_dk_smooth',smoothOn?'1':'0')}catch(e){}
  if(state!=='rec') setStat(smoothOn?'KI-Glätten an':'KI-Glätten aus – der Text wird so kopiert, wie er erkannt wurde');
}
function toggleTheme(){
  const l=document.body.classList.toggle('light');
  try{localStorage.setItem('zo_dk_light',l?'1':'0')}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// Bildschirm bleibt während der Aufnahme an (Tablet)
async function keepAwake(){try{if('wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
function releaseAwake(){try{wakeLock?.release()}catch(e){} wakeLock=null}

// ── Öffnen = sofort aufnehmen ──
// Auch beim Zurückkehren in die App: nach einem fertigen Text beginnt ein neues Diktat (der alte steht im Verlauf),
// eine unterbrochene Aufnahme läuft weiter.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(state==='rec'){stopEngine();setState('paused');setStat('Pausiert')} return }
  if(state==='paused') startRec(true);
  else if(state==='done'||state==='idle') startRec(false);
});
window.addEventListener('load',()=>startRec(false));

// Knopf „Installieren“: erscheint, sobald Chrome die Diktier-App als eigene App anbietet
let instEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;$('instbtn').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{instEvt=null;$('instbtn').classList.add('hidden')});
async function installApp(){ if(!instEvt) return; instEvt.prompt(); try{await instEvt.userChoice}catch(e){} instEvt=null; $('instbtn').classList.add('hidden') }

if('serviceWorker' in navigator && !location.hostname.includes('claudeusercontent')){
  navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW Fehler:',e));
}
</script>
</body>
</html>
