<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>ZenOffice · Diktat</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="/diktat/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#111010">
<link rel="icon" type="image/png" href="/diktat-icon-192.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diktat">
<link rel="apple-touch-icon" href="/diktat-icon-180.png?v=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111010;--bg2:#181716;--bg3:#201e1d;--bg4:#2a2725;
  --border:#2e2b29;--border2:#3a3632;
  --text:#e8e2d9;--text2:#9a9088;--text3:#5a5450;
  --gold:#c9a96e;--gold2:#a07840;--sage:#7a9e7e;--rose:#c4847a;--sky:#7a9ec4;
  --fs:'Cormorant Garamond',Georgia,serif;--fn:'DM Sans',system-ui,sans-serif;
}
body.light{
  --bg:#f5f1eb;--bg2:#faf7f2;--bg3:#ede9e0;--bg4:#e0dbd0;
  --border:#d8d2c5;--border2:#c8c0b0;
  --text:#1a1714;--text2:#7a7060;--text3:#b0a898;
  --gold:#8b6535;--gold2:#6b4e28;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fn);display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:hidden;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:880px;flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}

/* Kopfzeile */
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd img{width:30px;height:30px;border-radius:8px}
.ttl{font-family:var(--fs);font-size:24px;font-weight:300;letter-spacing:.04em;color:var(--gold);flex:1}
.ttl small{font-family:var(--fn);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-left:6px}
.pill{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:999px;padding:9px 16px;font:500 14px var(--fn);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;user-select:none}
.pill:active{transform:scale(.96)}
.pill.on{color:var(--gold);border-color:var(--gold2)}
.pill svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill.sm{padding:8px 12px;font-size:13px}

/* Textfeld */
#txt{flex:1;min-height:120px;width:100%;resize:none;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:18px;
  padding:20px 22px;font:300 clamp(19px,2.6vw,24px)/1.55 var(--fn);outline:none;transition:border-color .2s}
#txt:focus{border-color:var(--border2)}
#txt.rec{border-color:rgba(196,132,122,.55)}
#txt.busy{opacity:.45}
#txt::placeholder{color:var(--text3)}

/* Status */
#stat{min-height:24px;text-align:center;font-size:15px;color:var(--text2)}
#stat.ok{color:var(--sage)}
#stat.err{color:var(--rose)}
#stat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rose);margin-right:8px;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}

/* Knöpfe unten */
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.bot{display:flex;align-items:center;justify-content:center;gap:22px}
#mic{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold2);background:var(--bg3);color:var(--gold);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px var(--fn);transition:all .2s;flex-shrink:0}
#mic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#mic:active{transform:scale(.95)}
#mic.rec{border-color:var(--rose);color:var(--rose);background:rgba(196,132,122,.12);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(196,132,122,.45)}70%{box-shadow:0 0 0 22px rgba(196,132,122,0)}100%{box-shadow:0 0 0 0 rgba(196,132,122,0)}}
.side{width:150px;display:flex;justify-content:center}
#go{height:64px;border-radius:999px;border:1.5px solid var(--sage);background:rgba(122,158,126,.14);color:var(--sage);cursor:pointer;
  padding:0 18px;font:500 15px/1.15 var(--fn);display:flex;align-items:center;gap:8px;text-align:left;transition:all .15s}
#go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#go:active{transform:scale(.96)}
#go:disabled{opacity:.35}

/* Verlauf */
#hist{display:none;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:12px}
#hist.vis{display:flex}
#hist .row2{display:flex;align-items:stretch;gap:8px;transition:transform .2s,opacity .2s;touch-action:pan-y}
#hist .it{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--text);cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#hist .it:active{border-color:var(--gold2)}
#hist .del{width:46px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--rose);cursor:pointer;display:flex;align-items:center;justify-content:center}
#hist .del svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hist .tip{font-size:12px;color:var(--text3);text-align:center}
#hist .em{color:var(--text3);font-size:14px;text-align:center;padding:8px}
.hidden{display:none!important}
@media (max-height:520px){#mic{width:76px;height:76px}#mic svg{width:28px;height:28px}.wrap{gap:10px}#go{height:54px}}
@media (max-width:480px){.side{width:auto}.bot{gap:12px}#go{padding:0 12px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <img src="/diktat-icon-192.png?v=1" alt="">
    <div class="ttl">Diktat<small>ZenOffice</small></div>
    <button class="pill sm on" onclick="toZen()" title="Text in ZenOffice öffnen – dort weiterbearbeiten oder ein Bild daraus machen">ZenOffice
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="pill sm" id="engbtn" onclick="toggleEngine()" title="Wer schreibt deine Sprache mit? Browser (kostenlos, Text erscheint sofort) oder Premium (Google Gemini, genauer, kostet etwas)">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span id="englbl">Browser</span></button>
    <button class="pill sm" id="langbtn" onclick="toggleLang()" title="Sprache">DE</button>
    <button class="pill sm on" id="smbtn" onclick="toggleSmooth()" title="Glätten: Sanft (Formulierungen verbessern, dein Tonfall bleibt) · Gründlich (wie „Grammatik &amp; Klang“ in ZenOffice) · Aus">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg><span id="smlbl">Sanft</span></button>
    <button class="pill sm" onclick="toggleTheme()" title="Hell / Dunkel">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
  </div>

  <textarea id="txt" placeholder="Einfach losreden … (Antippen hält die Aufnahme an, dann kannst du von Hand ändern)" spellcheck="true"></textarea>
  <div id="stat"></div>

  <div class="row" id="acts">
    <button class="pill" onclick="copyNow()"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Kopieren</button>
    <button class="pill hidden" id="origbtn" onclick="toggleOrig()"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Original</span></button>
    <button class="pill hidden" id="playbtn" onclick="playLast()" title="Die letzte Premium-Aufnahme anhören"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><span>Anhören</span></button>
    <button class="pill" onclick="toggleHist()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  </div>
  <div id="hist"></div>

  <div class="bot">
    <div class="side"><button class="pill" onclick="clearAll()" title="Text in den Verlauf legen und mit leerer Seite neu beginnen">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>Neuer Text</button></div>
    <button id="mic" onclick="micTap()"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span id="miclbl">Sprechen</span></button>
    <div class="side"><button id="go" onclick="goTap()"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span id="golbl">Glätten &amp;<br>kopieren</span></button></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// ZenOffice Diktat – sprechen, glätten, kopieren
// ═══════════════════════════════════════
const $=id=>document.getElementById(id);
const txt=$('txt'), stat=$('stat'), mic=$('mic');
const SMOOTH_MODEL='claude-haiku-5-5'; // Nano: schnell und günstig; Ersatzkette liegt in api/claude.js
let state='idle';          // idle (Text frei bearbeitbar) | rec | smooth
let rec=null, base='', live='', lang='de-DE', raw='', smoothed='', showOrig=false, wakeLock=null;
let smoothOn=true, smoothLvl=1, engine='browser'; // smoothLvl 0 aus · 1 sanft · 2 gründlich
try{engine=localStorage.getItem('zo_dk_engine')==='premium'?'premium':'browser'}catch(e){}
try{const v=localStorage.getItem('zo_dk_smooth');smoothLvl=v==='0'?0:v==='2'?2:1}catch(e){}
smoothOn=smoothLvl>0;
try{if(localStorage.getItem('zo_dk_light')==='1')document.body.classList.add('light')}catch(e){}
try{lang=localStorage.getItem('zo_dk_lang')||'de-DE'}catch(e){}
updSmooth();
$('langbtn').textContent=lang==='de-DE'?'DE':'EN';
updGo(); updEngine();

function setStat(html,cls=''){stat.className=cls;stat.innerHTML=html}
function setState(s){
  state=s;
  const r=s==='rec';
  mic.classList.toggle('rec',r);
  txt.classList.toggle('rec',r);
  txt.classList.toggle('busy',s==='smooth');
  txt.readOnly=s==='smooth'; // während der Aufnahme nicht sperren – sonst lässt sich nichts markieren
  $('miclbl').textContent=r?'Pause':'Sprechen';
  $('acts').style.visibility=(r||s==='smooth')?'hidden':'visible';
  $('go').disabled=s==='smooth';
  if(r) keepAwake(); else releaseAwake();
}
function updGo(){$('golbl').innerHTML=smoothOn?'Glätten &amp;<br>kopieren':'Kopieren'}

// ── Aufnahme ──
// Mikrofon: Aufnahme an/aus. Es wird IMMER am vorhandenen Text weitergeschrieben – eine leere Seite gibt es nur über „Neuer Text“.
function micTap(){
  // Premium beim Öffnen ohne Fingertipp: Der Browser hält die Tonverarbeitung an, bis man einmal tippt → dann nur fortsetzen
  if(state==='rec'&&pm&&pm.ctx.state==='suspended'){ pm.ctx.resume(); setStat('<span class="dot"></span>Premium hört zu … (Text erscheint beim Anhalten oder nach längeren Pausen)'); return }
  if(state==='rec') pauseRec(); else if(state!=='smooth') startRec();
}
function pauseRec(msg){
  stopEngine(); setState('idle'); saveCur();
  setStat(msg||'Pause – Text kannst du jetzt von Hand ändern. Weitersprechen: Mikrofon.');
}
// Schreibstelle: Steht der Cursor mitten im Text, wird dort weiterdiktiert (Wunsch 2026-11-08 – vorher immer ans Ende).
// Ohne gesetzten Cursor steht er nach jeder Änderung durch die App am Ende → dann wie bisher anhängen.
let tail='', insPos=-1;
const glue=a=>a&&!/^[\s.,;:!?)]/.test(a)?' '+a:a;   // Leerzeichen vor dem Rest, falls nötig
function caretPos(){ const v=txt.value, p=txt.selectionEnd; return (p==null||p>=tailTrim(v).length)?v.length:p }
function startRec(){
  if(state==='rec') return;
  insPos=caretPos();
  if(engine==='premium'){ startPremium(); return }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){setStat('Spracheingabe geht hier nicht – bitte Chrome verwenden oder oben „Premium“ wählen.','err');return}
  txt.blur();
  base=tailTrim(txt.value.slice(0,insPos)); tail=txt.value.slice(insPos); live=base;
  setState('rec');
  setStat('<span class="dot"></span>Ich höre zu … (Text antippen = anhalten und von Hand ändern)');
  runEngine();
}
// Antippen des Textes während der Aufnahme: anhalten, damit man von Hand ändern kann (Tastatur geht auf)
txt.addEventListener('pointerdown',()=>{ if(state==='rec'){ pauseRec('Aufnahme angehalten – jetzt von Hand ändern. Weitersprechen: Mikrofon.') } });
txt.addEventListener('input',()=>{ if(showOrig||smoothed){ smoothed=''; showOrig=false; $('origbtn').classList.add('hidden') } saveCur() });
function runEngine(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR(); rec.lang=lang; rec.continuous=true; rec.interimResults=true;
  let heard=false, t0=Date.now(); // wurde in dieser Runde etwas gesprochen? wann begann sie?
  rec.onstart=()=>{t0=Date.now()};
  rec.onresult=e=>{
    const t=dicText(e.results); if(!t) return;
    heard=true;
    live=join(base,t);
    txt.value=live+glue(tail); txt.setSelectionRange(live.length,live.length);
    if(!tail) txt.scrollTop=txt.scrollHeight; saveCur();
  };
  // Chrome (v. a. Android) beendet nach einer Sprechpause von selbst; jeder Neustart piept.
  // Darum nur weiterhören, wenn in dieser Runde gesprochen wurde. Endet eine Runde stumm,
  // hält die Aufnahme an – so gibt es kein Dauer-Piepen mehr.
  rec.onend=()=>{
    base=live;
    if(state!=='rec') return;
    if(heard){
      heard=false;
      // Der Huawei-Browser beendet die Runde schon nach ein, zwei Wörtern (Chrome erst nach einer längeren Pause).
      // Darum sofort neu starten – früher 150 ms Wartezeit plus Startzeit, dabei gingen Wörter verloren.
      // Nach mehreren sehr kurzen Runden: Hinweis auf Premium, das ohne An/Aus durchgehend aufnimmt.
      if(Date.now()-t0<4000){ if(++shortRuns===3&&engine==='browser') setStat('<span class="dot"></span>Dieser Browser schaltet das Mikrofon nach jedem Satzteil ab – dabei können Wörter verloren gehen. Tipp: oben „Premium“ wählen, das nimmt durchgehend auf.','err') }
      try{rec.start()}catch(e){ if(state==='rec') runEngine() }
      return }
    // Stille: nur anhalten – geglättet wird erst auf Knopfdruck
    pauseRec(txt.value.trim()?'Pause – weitersprechen mit dem Mikrofon, fertig mit „'+(smoothOn?'Glätten & kopieren':'Kopieren')+'“.':'Nichts gehört – zum Sprechen aufs Mikrofon tippen.');
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      pauseRec(); setStat('Bitte den Mikrofon-Zugriff erlauben – dann aufs Mikrofon tippen.','err');
    }
  };
  try{rec.start()}catch(e){console.warn('Diktat Start Fehler:',e)}
}
// discard=true: laufende Premium-Aufnahme verwerfen (z. B. „Neuer Text“), sonst noch erkennen und anhängen
function stopEngine(discard){
  if(pm) stopPremium(discard);
  if(!rec) return;
  rec.onend=rec.onerror=rec.onresult=null;
  try{rec.stop()}catch(e){}
  rec=null; base=live;
}
// Neuen Satzteil anhängen, Satzanfang groß
function join(a,b){
  b=b.trim(); if(!b) return a;
  const cap=()=>b[0].toUpperCase()+b.slice(1);
  if(!a.trim()) return a.replace(/[^\n]/g,'')+cap();
  if(/\n$/.test(a)) return a+cap();           // von Hand neue Zeile/Absatz begonnen → dort weiterschreiben
  if(/[.!?:]$/.test(a)) b=cap();
  return a+' '+b;
}
// Textende ohne Leerzeichen, aber mit Zeilenumbrüchen (Absätze bleiben)
const tailTrim=v=>v.replace(/[ \t]+$/,'');// Wie in ZenOffice: Android liefert denselben Satz mehrfach und wachsend – wiederholte Fassungen ersetzen die vorige
function dicText(results){
  const norm=t=>t.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim(), parts=[];
  for(let i=0;i<results.length;i++){
    const t=results[i][0].transcript.trim(); if(!t) continue;
    if(parts.length){
      const a=norm(parts[parts.length-1]), b=norm(t);
      if(b.startsWith(a)){parts[parts.length-1]=t;continue}
      if(a.startsWith(b)) continue;
    }
    parts.push(t);
  }
  return parts.join(' ');
}

// ── Großer Knopf: glätten (falls an) und kopieren ──
async function goTap(){
  if(state==='smooth') return;
  if(state==='rec'){ stopEngine(); setState('idle') }
  if(sttBusy){ setStat('Sprache wird noch erkannt …'); await sttChain }
  const t=txt.value.trim();
  if(!t){setStat('Noch kein Text – aufs Mikrofon tippen und sprechen.');return}
  if(!smoothOn){ await copyOut(t,''); return }
  raw=t; await smooth(t);
}
async function smooth(t){
  setState('smooth');
  setStat('Text wird geglättet …');
  try{
    const r=await callClaude(t);
    if(!r.trim()) throw new Error('leere Antwort');
    smoothed=r.trim(); txt.value=smoothed; showOrig=false;
    $('origbtn').classList.toggle('hidden',smoothed===raw);
    $('origbtn').querySelector('span').textContent='Original';
    setState('idle'); saveCur();
    // Sichtbar machen, wie viel sich geändert hat – sonst wirkt Glätten bei sauberem Text, als täte es nichts
    const n=diffWords(raw,smoothed);
    await copyOut(smoothed, n? 'Geglättet: '+n+(n===1?' Wort':' Wörter')+' geändert („Original“ zeigt den Text vorher)'
                             : 'Nichts zu glätten – der Text war schon in Ordnung');
  }catch(e){
    console.warn('Glätten Fehler:',e);
    txt.value=t; setState('idle');
    await copyOut(t,'Glätten ging nicht ('+esc(e.message)+') – Originaltext');
  }
}

// Wie viele Wörter wurden geändert, entfernt oder ergänzt? (Wortvergleich über die längste gemeinsame Folge)
function diffWords(a,b){
  const x=a.split(/\s+/).filter(Boolean), y=b.split(/\s+/).filter(Boolean);
  if(x.length*y.length>4e6) return Math.abs(x.length-y.length)||1;
  let prev=new Uint16Array(y.length+1);
  for(let i=1;i<=x.length;i++){const cur=new Uint16Array(y.length+1);
    for(let j=1;j<=y.length;j++) cur[j]=x[i-1]===y[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]); prev=cur}
  return Math.max(x.length,y.length)-prev[y.length];
}
// Glätten-Stufen (Wunsch 2026-11-03):
// Sanft = das frühere „Gründlich“ (Formulierungen verbessern, Gedankengang und Tonfall bleiben, plus Diktat-Regeln).
// Gründlich = genau wie „Optimieren → Grammatik & Klang“ in ZenOffice (gleiche Anweisung, gleiches Modell Haiku) –
// diese Art der Überarbeitung gefällt dem Nutzer am besten. Nur „Absätze erhalten“ kommt dazu.
// Seine wörtliche Diktierregel gibt es weiter in ZenOffice unter „Optimieren → Meine Diktierregel“.
async function callClaude(text){
  const task=smoothLvl===2
    ? 'Verbessere Grammatik, Klang und Stil. Seriös aber modern und angenehm. Absätze und Zeilenumbrüche bleiben erhalten. Nur der Text.'
    : 'Überarbeite meinen diktierten Text gründlich zu einem gut lesbaren, geschriebenen Text. Korrigiere Grammatik, Rechtschreibung und Zeichensetzung. '
      +'Ersetze ungenaue, umständliche, holprige oder gesprochen klingende Formulierungen durch treffendere und flüssigere – klar und natürlich, nicht gestelzt. '
      +'Bewahre meinen Gedankengang, meine Aussagen, meinen Tonfall und meine Persönlichkeit. '
      +'Fasse nicht zusammen, lass keine Inhalte weg, interpretiere meine Aussagen nicht um und füge keine eigenen Gedanken hinzu. '
      +'Das Ergebnis soll klingen, als hätte ich selbst einen sehr guten Text geschrieben.\n\n'
      +'Schreibe korrektes Schriftdeutsch (Hochdeutsch), keine Umgangs- oder Regionalsprache: Verkürzungen wie „geht’s“, „gibt’s“, „erstmal“, „dran“, „drauf“, „nix“, „ne“, „nich“, „haste“ schreibst du aus („geht es“, „erst einmal“, „daran“ …). '
      +'Füllwörter, die nur Sprechpausen füllen („okay“, „also“, „halt“, „äh“), sowie abgebrochene Satzanfänge und Selbstkorrekturen („er muss – ich muss“) entfernst du; nur die gemeinte Fassung bleibt. '
      +'Zum Diktat: Die Spracherkennung verhört sich manchmal. Ein Wort ersetzt du nur, wenn aus dem Zusammenhang eindeutig ist, was gemeint war; '
      +'bist du unsicher, lass das Wort so stehen, wie es erkannt wurde – niemals raten. '
      +'Gesprochene Anweisungen wie „Komma“, „Punkt“, „Fragezeichen“, „neue Zeile“ oder „neuer Absatz“ setzt du als Zeichen bzw. Umbruch um. '
      +'Absätze und Zeilenumbrüche bleiben genau so erhalten. Sprache des Textes beibehalten. Nur der Text.';
  const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:SMOOTH_MODEL,max_tokens:Math.min(4000,600+text.length),
      system:'Du bist ein professioneller Textassistent. Gib NUR den fertigen Text zurück – keine Vorbemerkungen, Anführungszeichen oder Erklärungen.',
      messages:[{role:'user',content:'Aufgabe: '+task+'\n\nText:\n'+text}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error||'Claude Fehler '+r.status)}
  const d=await r.json();
  return d.content?.map(c=>c.text||'').join('')||'';
}

// ── Zwischenablage ──
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true }catch(e){}
  // Ersatz für ältere Browser: über das Textfeld kopieren
  try{ txt.focus(); txt.select(); const ok=document.execCommand('copy'); txt.setSelectionRange(txt.value.length,txt.value.length); txt.blur(); return ok }catch(e){ return false }
}
async function copyOut(t,label){
  addHist(t);
  if(await copyText(t)) setStat('✓ '+(label?label+' · ':'')+'kopiert – jetzt einfach einfügen','ok');
  else setStat((label?label+'. ':'')+'Automatisch kopieren ging nicht – bitte auf „Kopieren“ tippen.','err');
}
async function copyNow(){
  const t=txt.value.trim(); if(!t) return;
  const ok=await copyText(t);
  setStat(ok?'✓ Kopiert':'Kopieren ging nicht – Text markieren und lange drücken.',ok?'ok':'err');
}
function toggleOrig(){
  showOrig=!showOrig;
  txt.value=showOrig?raw:smoothed; saveCur();
  $('origbtn').querySelector('span').textContent=showOrig?'Geglättet':'Original';
  copyNow();
}
function clearAll(){
  if(state==='rec') stopEngine(true);
  sttGen++; lastAudio=[]; $('playbtn').classList.add('hidden');
  if(txt.value.trim()) addHist(txt.value.trim());
  txt.value=''; raw=smoothed=''; showOrig=false; $('origbtn').classList.add('hidden');
  setState('idle'); saveCur();
  startRec();
}
// Aktueller Text wird laufend gemerkt – schließt das Gerät die App, landet er beim nächsten Öffnen im Verlauf
function saveCur(){try{localStorage.setItem('zo_dk_cur',txt.value)}catch(e){}}

// ── Verlauf (die letzten 15 Texte, nur auf diesem Gerät). Einzeln löschen: Mülleimer oder nach links wischen ──
function getHist(){try{return JSON.parse(localStorage.getItem('zo_dk_hist')||'[]')}catch(e){return[]}}
function setHist(h){try{localStorage.setItem('zo_dk_hist',JSON.stringify(h.slice(0,15)))}catch(e){}}
function addHist(t){
  if(!t) return;
  const h=getHist().filter(x=>x!==t); h.unshift(t); setHist(h);
  if($('hist').classList.contains('vis')) renderHist();
}
function delHist(i){const h=getHist();h.splice(i,1);setHist(h);renderHist()}
const TRASH='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
function renderHist(){
  const h=getHist(), box=$('hist');
  box.innerHTML=h.length?'<div class="tip">Antippen = übernehmen und kopieren · nach links wischen oder Mülleimer = löschen</div>':'<div class="em">Noch nichts im Verlauf</div>';
  h.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='row2';
    const d=document.createElement('div'); d.className='it'; d.textContent=t;
    const del=document.createElement('button'); del.className='del'; del.title='Löschen'; del.innerHTML=TRASH;
    del.onclick=()=>delHist(i);
    d.onclick=async()=>{
      if(row.dataset.swiped) return;
      if(state==='rec') stopEngine(true);
      sttGen++;
      const cur=txt.value.trim(); if(cur&&cur!==t) addHist(cur);
      txt.value=t; raw=smoothed=''; showOrig=false; $('origbtn').classList.add('hidden'); setState('idle'); saveCur();
      const ok=await copyText(t); setStat(ok?'✓ Aus dem Verlauf übernommen und kopiert':'Übernommen – bitte auf „Kopieren“ tippen.',ok?'ok':'err')};
    // Wischen nach links löscht
    let x0=null,dx=0;
    row.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;delete row.dataset.swiped});
    row.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.min(0,e.clientX-x0);if(dx<-8){row.style.transform='translateX('+dx+'px)';row.style.opacity=String(1+dx/250)}});
    const up=()=>{if(x0===null)return;x0=null;
      if(dx<-90){row.dataset.swiped='1';row.style.transform='translateX(-110%)';row.style.opacity='0';setTimeout(()=>delHist(i),180)}
      else{if(dx<-8)row.dataset.swiped='1';row.style.transform='';row.style.opacity='';setTimeout(()=>delete row.dataset.swiped,50)}};
    row.addEventListener('pointerup',up); row.addEventListener('pointercancel',up); row.addEventListener('pointerleave',up);
    row.append(d,del); box.appendChild(row)});
}
function toggleHist(){const b=$('hist');b.classList.toggle('vis');if(b.classList.contains('vis'))renderHist()}

// ═══════════════════════════════════════
// PREMIUM-ERKENNUNG: eigene Aufnahme → Gemini (api/stt.js)
// Aufnahme in Stücken als WAV (16 kHz, mono) – jede Anfrage bleibt weit unter Vercels 4,5 MB.
// Früher wurde nach jeder kurzen Pause ein 2–3-Sekunden-Schnipsel geschickt: ohne Zusammenhang riet Gemini
// („glätten“ → „klettern“) und erfand sogar Sätze. Jetzt: lange Stücke (Pause > 2,5 s erst ab 15 s Sprache,
// spätestens 55 s) plus der bisherige Text als Zusammenhang.
// ═══════════════════════════════════════
let shortRuns=0;
let pm=null, sttChain=Promise.resolve(), sttBusy=0, sttGen=0, lastAudio=[];
const STT_RATE=16000;
async function startPremium(){
  if(!navigator.mediaDevices?.getUserMedia){setStat('Aufnehmen geht in diesem Browser nicht.','err');return}
  txt.blur(); setState('rec');
  setStat('<span class="dot"></span>Premium hört zu … (Text erscheint beim Anhalten oder nach längeren Pausen)');
  try{
    // Echo-Unterdrückung aus (es läuft nichts mit), sie verzerrt Sprache; Rauschfilter und Pegel bleiben an
    const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
    if(state!=='rec'){stream.getTracks().forEach(t=>t.stop());return}
    // Der Browser rechnet sauber auf 16 kHz um (besser als eigenes Verkleinern); geht das nicht, normale Rate
    let ctx; try{ctx=new AudioContext({sampleRate:STT_RATE})}catch(e){ctx=new (window.AudioContext||window.webkitAudioContext)()}
    const src=ctx.createMediaStreamSource(stream), proc=ctx.createScriptProcessor(4096,1,1);
    pm={stream,ctx,src,proc,buf:[],len:0,speech:0,silent:0,quiet:0};
    proc.onaudioprocess=e=>{
      if(!pm) return;
      const d=new Float32Array(e.inputBuffer.getChannelData(0)), dur=d.length/ctx.sampleRate;
      let sum=0; for(let i=0;i<d.length;i++) sum+=d[i]*d[i];
      const loud=Math.sqrt(sum/d.length)>0.012;
      if(loud){pm.speech+=dur;pm.silent=0;pm.quiet=0} else {pm.silent+=dur;pm.quiet+=dur}
      pm.buf.push(d); pm.len+=d.length;
      const secs=pm.len/ctx.sampleRate;
      // Vor dem ersten Wort nur die letzte Sekunde behalten (keine langen Stillen verschicken)
      if(!pm.speech){ while(pm.buf.length>1&&(pm.len-pm.buf[0].length)/ctx.sampleRate>1){pm.len-=pm.buf.shift().length} }
      else if((pm.silent>2.5&&pm.speech>15)||secs>55) flushPremium();
      // 10 Sekunden nichts gesagt → Pause (Wunsch 2026-11-06; früher 2 Minuten). Kurzes Nachdenken bleibt möglich.
      if(pm&&pm.quiet>10) pauseRec('Pause nach 10 Sekunden Stille – weitersprechen mit dem Mikrofon, fertig mit „'+(smoothOn?'Glätten & kopieren':'Kopieren')+'“.');
    };
    src.connect(proc); proc.connect(ctx.destination);
    // Beim automatischen Start (ohne Fingertipp) lassen Browser die Tonverarbeitung oft ruhen – dann wurde nichts
    // aufgenommen und auch die Pause nach Stille griff nicht. Versuchen fortzusetzen, sonst um einen Tipp bitten.
    try{ctx.resume().catch(()=>{})}catch(e){}  // nicht abwarten: ohne Tipp bleibt das Versprechen offen
    setTimeout(()=>{ if(pm&&pm.ctx===ctx&&ctx.state==='suspended') setStat('<span class="dot"></span>Bitte einmal aufs Mikrofon tippen, dann hört Premium zu.') },400);
  }catch(e){
    console.warn('Premium Aufnahme Fehler:',e); pm=null; setState('idle');
    setStat(e.name==='NotAllowedError'?'Bitte den Mikrofon-Zugriff erlauben – dann aufs Mikrofon tippen.':'Aufnahme ging nicht: '+esc(e.message),'err');
  }
}
function flushPremium(){
  if(!pm||!pm.len) return;
  const parts=pm.buf, len=pm.len, rate=pm.ctx.sampleRate, hadSpeech=pm.speech>0.3;
  pm.buf=[]; pm.len=0; pm.speech=0; pm.silent=0;
  if(!hadSpeech) return;
  const gen=sttGen; sttBusy++;
  const wav=toWav16(parts,len,rate); lastAudio.push(wav); $('playbtn').classList.remove('hidden');
  sttChain=sttChain.then(async()=>{
    try{
      const t=await transcribe(wav, txt.value.slice(0,insPos<0?undefined:insPos).trim().slice(-600));
      if(t&&gen===sttGen){
        // An der Schreibstelle einfügen (Ende oder Cursor), ohne eine Markierung des Nutzers zu zerstören
        const v=txt.value, p=(insPos<0||insPos>v.length)?v.length:insPos;
        const before=tailTrim(v.slice(0,p)), after=v.slice(p), nb=join(before,t);
        const atEnd=!after.trim();
        txt.setRangeText(nb.slice(before.length)+(atEnd?'':glue(after).slice(0,glue(after).length-after.length)),before.length,atEnd?v.length:p,'preserve');
        insPos=atEnd?txt.value.length:nb.length;
        if(atEnd) txt.scrollTop=txt.scrollHeight; saveCur() }
    }catch(e){ console.warn('Premium-Erkennung Fehler:',e); setStat('Premium-Erkennung ging nicht ('+esc(e.message)+') – oben auf „Browser“ umschalten.','err') }
    finally{ sttBusy--; if(!sttBusy&&state!=='rec'&&!/err/.test(stat.className)) setStat('Fertig erkannt – weitersprechen mit dem Mikrofon, fertig mit „'+(smoothOn?'Glätten & kopieren':'Kopieren')+'“.') }
  });
  if(state!=='rec') setStat('Sprache wird erkannt …');
}
function stopPremium(discard){
  if(!pm) return;
  if(!discard) flushPremium();
  try{pm.proc.disconnect();pm.src.disconnect();pm.stream.getTracks().forEach(t=>t.stop());pm.ctx.close()}catch(e){}
  pm=null;
  if(sttBusy) setStat('Sprache wird erkannt …');
}
// Float-Stücke → 16 kHz mono 16-Bit-WAV als Base64
function toWav16(parts,len,rate){
  const all=new Float32Array(len); let o=0; parts.forEach(p=>{all.set(p,o);o+=p.length});
  // Lautstärke angleichen: Das Huawei-Tablet nimmt sehr leise auf. Früher richtete sich die Verstärkung nach dem
  // lautesten Einzelwert – ein Knacken (z. B. Antippen) verhinderte dann jede Verstärkung. Jetzt zählt der Sprachpegel:
  // Lautstärke je 20-ms-Abschnitt, davon der lauteste Zehntel-Wert (= deutliche Sprache) → Zielpegel, höchstens 30-fach;
  // Spitzen werden weich begrenzt statt hart abgeschnitten.
  const fr=Math.max(1,Math.round(rate/50)), lv=[];
  for(let i=0;i+fr<=len;i+=fr){let q=0;for(let j=i;j<i+fr;j++)q+=all[j]*all[j];lv.push(Math.sqrt(q/fr))}
  lv.sort((a,b)=>a-b);
  const speech=lv.length?lv[Math.floor(lv.length*0.9)]:0, gain=speech>1e-4?Math.min(30,0.2/speech):1;
  if(gain>1.05) for(let i=0;i<len;i++) all[i]=Math.tanh(all[i]*gain);
  const n=Math.floor(len*STT_RATE/rate), pcm=new DataView(new ArrayBuffer(44+n*2)), r=rate/STT_RATE;
  const w=(p,s)=>{for(let i=0;i<s.length;i++)pcm.setUint8(p+i,s.charCodeAt(i))};
  w(0,'RIFF');pcm.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');pcm.setUint32(16,16,true);pcm.setUint16(20,1,true);pcm.setUint16(22,1,true);
  pcm.setUint32(24,STT_RATE,true);pcm.setUint32(28,STT_RATE*2,true);pcm.setUint16(32,2,true);pcm.setUint16(34,16,true);w(36,'data');pcm.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ // Mittelwert über den Bereich = einfacher Tiefpass beim Verkleinern
    const a=Math.floor(i*r), b=Math.min(len,Math.max(a+1,Math.floor((i+1)*r))); let s=0; for(let j=a;j<b;j++) s+=all[j];
    const v=Math.max(-1,Math.min(1,s/(b-a))); pcm.setInt16(44+i*2,v<0?v*0x8000:v*0x7FFF,true) }
  const u=new Uint8Array(pcm.buffer); let bin=''; for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(bin);
}
async function transcribe(b64,context){
  const r=await fetch('/api/stt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,lang,context})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e?.error||'Fehler '+r.status)}
  return ((await r.json()).text||'').trim();
}
// Letzte Premium-Aufnahme anhören: zeigt, ob das Mikrofon sauber aufnimmt oder die Erkennung danebenliegt
let playing=null;
function playLast(){
  if(playing){playing.pause();playing=null;$('playbtn').querySelector('span').textContent='Anhören';return}
  if(!lastAudio.length) return;
  const q=[...lastAudio]; $('playbtn').querySelector('span').textContent='Stopp';
  const next=()=>{ if(!q.length){playing=null;$('playbtn').querySelector('span').textContent='Anhören';return}
    playing=new Audio('data:audio/wav;base64,'+q.shift()); playing.onended=next; playing.play().catch(next) };
  next();
}
function updEngine(){
  $('englbl').textContent=engine==='premium'?'Premium':'Browser';
  $('engbtn').classList.toggle('on',engine==='premium');
}
function toggleEngine(){
  const wasRec=state==='rec'; if(wasRec) pauseRec();
  engine=engine==='premium'?'browser':'premium'; updEngine();
  try{localStorage.setItem('zo_dk_engine',engine)}catch(e){}
  setStat(engine==='premium'
    ?'Premium: Google Gemini schreibt mit – genauer, Text kommt beim Anhalten oder nach längeren Pausen, kostet pro Aufnahme etwas.'
    :'Browser: die eingebaute Spracherkennung des Browsers – kostenlos, Text erscheint sofort beim Sprechen.');
}

// ── Pfeil „ZenOffice“: Text an die große App übergeben (gleiche Adresse → als /#zo-text=… im neuen Fenster) ──
// Dort entsteht daraus ein neuer Text im Textbereich; Seitenleiste, Optimieren, „→ Vision senden“ usw. stehen bereit.
async function toZen(){
  if(state==='rec') pauseRec();
  if(sttBusy){ setStat('Sprache wird noch erkannt …'); await sttChain }
  const t=txt.value.trim(); if(t) addHist(t);
  const url='/'+(t?'#zo-text='+encodeURIComponent(t):'');
  // Benanntes Fenster: Ist ZenOffice von hier aus schon offen, wird dieses Fenster wiederverwendet
  // (kein Stapel neuer Fenster beim Hin- und Herwechseln); dort übernimmt „hashchange“ den Text.
  let w=null; try{ w=window.open(url,'zenoffice') }catch(e){}
  if(!w) location.href=url;   // Fenster blockiert → in diesem Fenster öffnen
}

// ── Einstellungen ──
function toggleLang(){
  lang=lang==='de-DE'?'en-US':'de-DE';
  $('langbtn').textContent=lang==='de-DE'?'DE':'EN';
  try{localStorage.setItem('zo_dk_lang',lang)}catch(e){}
  if(state==='rec'&&engine==='browser'){stopEngine();runEngine()}
}
function updSmooth(){
  $('smbtn').classList.toggle('on',smoothOn);
  $('smlbl').textContent=['Glätten aus','Sanft','Gründlich'][smoothLvl];
}
function toggleSmooth(){
  smoothLvl=(smoothLvl+1)%3; smoothOn=smoothLvl>0; updSmooth(); updGo();
  try{localStorage.setItem('zo_dk_smooth',String(smoothLvl))}catch(e){}
  if(state!=='rec') setStat(['KI-Glätten aus – der Text wird so kopiert, wie er erkannt wurde',
    'Sanft: verbessert holprige und ungenaue Formulierungen – dein Gedankengang und Tonfall bleiben',
    'Gründlich: wie „Grammatik & Klang“ in ZenOffice – seriös, modern und angenehm'][smoothLvl]);
}
function toggleTheme(){
  const l=document.body.classList.toggle('light');
  try{localStorage.setItem('zo_dk_light',l?'1':'0')}catch(e){}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// Bildschirm bleibt während der Aufnahme an (Tablet)
async function keepAwake(){try{if('wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
function releaseAwake(){try{wakeLock?.release()}catch(e){} wakeLock=null}

// ── Öffnen = sofort aufnehmen ──
// Beim Zurückkehren in die App: eine laufende Aufnahme geht weiter; ist die Seite leer, beginnt sie sofort.
// Vorhandener Text wird nie von selbst gelöscht.
let wasRec=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ wasRec=state==='rec'; if(wasRec) pauseRec(); return }
  if(state==='smooth') return;
  if(wasRec||!txt.value.trim()) startRec();
  else setStat('Weitersprechen: Mikrofon · leere Seite: „Neuer Text“');
});
window.addEventListener('load',()=>{
  // Text der letzten Sitzung (z. B. App vom Gerät geschlossen) in den Verlauf legen, dann frisch beginnen
  try{const c=(localStorage.getItem('zo_dk_cur')||'').trim(); if(c) addHist(c); localStorage.removeItem('zo_dk_cur')}catch(e){}
  startRec();
});

if('serviceWorker' in navigator && !location.hostname.includes('claudeusercontent')){
  navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW Fehler:',e));
}
